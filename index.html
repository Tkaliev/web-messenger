<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Messenger</title>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #auth { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f172a; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; z-index: 10; }
        #auth input { padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #1e293b; color: white; font-size: 16px; width: 80%; max-width: 300px; outline: none; }
        #auth button { padding: 12px 20px; border-radius: 8px; border: none; background: #2563eb; color: white; font-weight: bold; font-size: 16px; cursor: pointer; }
        
        header { background: #1e293b; padding: 15px; text-align: center; font-weight: bold; font-size: 18px; border-bottom: 1px solid #334155; }
        #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { background: #334155; padding: 10px 14px; border-radius: 12px; max-width: 75%; word-break: break-word; }
        .msg.me { background: #2563eb; align-self: flex-end; }
        .author { font-size: 11px; color: #94a3b8; margin-bottom: 3px; font-weight: bold; }
        
        .input-box { display: flex; padding: 10px; background: #1e293b; border-top: 1px solid #334155; gap: 8px; }
        input { flex: 1; background: #0f172a; border: 1px solid #475569; color: white; padding: 12px; border-radius: 8px; outline: none; font-size: 15px; }
        button { background: #2563eb; color: white; border: none; padding: 0 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="auth">
        <h2>Вход в мессенджер</h2>
        <input type="text" id="usernameInput" placeholder="Введите ваш ник..." autofocus>
        <button onclick="login()">Войти</button>
    </div>

    <header id="header" style="display:none;">💬 Мессенджер</header>
    <div id="chat" style="display:none;"></div>

    <div class="input-box" id="inputArea" style="display:none;">
        <input type="text" id="messageInput" placeholder="Введите сообщение...">
        <button onclick="sendMessage()">Отправить</button>
    </div>

<script>
    let ws;
    let username = '';
    const chat = document.getElementById('chat');
    const input = document.getElementById('messageInput');

    function login() {
        const val = document.getElementById('usernameInput').value.trim();
        if (!val) {
            alert('Введите имя!');
            return;
        }
        username = val;
        document.getElementById('auth').style.display = 'none';
        document.getElementById('header').style.display = 'block';
        document.getElementById('chat').style.display = 'flex';
        document.getElementById('inputArea').style.display = 'flex';

        connectWS();
    }

    function connectWS() {
        ws = new WebSocket('wss://194-76-138-9.sslip.io:9000/ws');

        ws.onmessage = function(event) {
            const res = JSON.parse(event.data);
            if (res.type === 'history') {
                chat.innerHTML = '';
                res.data.forEach(m => appendMsg(m.username, m.text));
            } else if (res.type === 'message') {
                appendMsg(res.username, res.text);
            }
        };
    }

    function appendMsg(author, text) {
        const div = document.createElement('div');
        div.className = 'msg' + (author === username ? ' me' : '');
        div.innerHTML = `<div class="author">${author}</div><div>${text}</div>`;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    function sendMessage() {
        const text = input.value.trim();
        if (text && ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ username: username, text: text }));
            input.value = '';
        }
    }

    input.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') sendMessage();
    });
</script>
</body>
</html>
