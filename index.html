<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Web Messenger</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Экран авторизации */
        #auth-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f172a; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; z-index: 100; }
        .auth-card { background: #1e293b; padding: 24px; border-radius: 16px; width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 14px; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .auth-title { font-size: 20px; font-weight: bold; text-align: center; color: #fff; }
        .auth-input { background: #0f172a; border: 1px solid #475569; color: white; padding: 12px; border-radius: 10px; font-size: 15px; outline: none; }
        .auth-btn { background: #2563eb; color: white; border: none; padding: 12px; border-radius: 10px; font-weight: bold; font-size: 15px; cursor: pointer; transition: background 0.2s; }
        .auth-btn:active { background: #1d4ed8; }

        /* Интерфейс мессенджера */
        header { background: #1e293b; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; font-weight: bold; font-size: 16px; }
        .user-badge { font-size: 12px; background: #334155; padding: 4px 10px; border-radius: 20px; color: #38bdf8; }
        
        #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: #0b0f19; }
        .msg { background: #1e293b; padding: 10px 14px; border-radius: 14px; max-width: 80%; word-break: break-word; border: 1px solid #334155; }
        .msg.me { background: #2563eb; align-self: flex-end; border-color: #3b82f6; }
        .author { font-size: 11px; color: #94a3b8; margin-bottom: 4px; font-weight: bold; }
        .msg.me .author { color: #bfdbfe; }
        
        .input-box { display: flex; padding: 12px; background: #1e293b; border-top: 1px solid #334155; gap: 8px; }
        input { flex: 1; background: #0f172a; border: 1px solid #475569; color: white; padding: 12px; border-radius: 10px; outline: none; font-size: 15px; }
        button { background: #2563eb; color: white; border: none; padding: 0 20px; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <!-- ЭКРАН ВХОДА -->
    <div id="auth-screen">
        <div class="auth-card">
            <div class="auth-title">💬 Вход в чат</div>
            <input type="text" id="usernameInput" class="auth-input" placeholder="Введите ваш никнейм..." maxlength="20" autofocus>
            <button class="auth-btn" onclick="login()">Войти в мессенджер</button>
        </div>
    </div>

    <!-- ОСНОВНОЙ ЧАТ -->
    <header>
        <span>💬 Free Messenger</span>
        <span class="user-badge" id="myUsername">Гость</span>
    </header>
    
    <div id="chat"></div>

    <div class="input-box">
        <input type="text" id="messageInput" placeholder="Написать сообщение..." autocomplete="off">
        <button onclick="sendMessage()">➤</button>
    </div>

<script>
    let ws;
    let username = '';
    const chat = document.getElementById('chat');
    const input = document.getElementById('messageInput');

    function login() {
        const nameInput = document.getElementById('usernameInput').value.trim();
        if (!nameInput) {
            alert('Введите никнейм!');
            return;
        }
        username = nameInput;
        document.getElementById('myUsername').innerText = '@' + username;
        document.getElementById('auth-screen').style.display = 'none';
        
        connectWebSocket();
    }

    function connectWebSocket() {
        ws = new WebSocket('wss://194-76-138-9.sslip.io:9000/ws');

        ws.onmessage = function(event) {
            const response = JSON.parse(event.data);
            if (response.type === 'history') {
                chat.innerHTML = '';
                response.data.forEach(m => appendMessage(m.username, m.text));
            } else if (response.type === 'message') {
                appendMessage(response.username, response.text);
            }
        };
    }

    function appendMessage(author, text) {
        const div = document.createElement('div');
        div.className = 'msg' + (author === username ? ' me' : '');
        div.innerHTML = `<div class="author">${author}</div><div>${text}</div>`;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    function sendMessage() {
        const text = input.value.trim();
        if (text && ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ username: username, text: text }));
            input.value = '';
        }
    }

    input.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') sendMessage();
    });
</script>
</body>
</html>
