<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Messenger</title>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background: #1e293b; padding: 15px; text-align: center; font-weight: bold; font-size: 18px; border-bottom: 1px solid #334155; }
        #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { background: #334155; padding: 10px 14px; border-radius: 12px; max-width: 75%; word-break: break-word; }
        .msg.me { background: #2563eb; align-self: flex-end; }
        .author { font-size: 11px; color: #94a3b8; margin-bottom: 3px; font-weight: bold; }
        .input-box { display: flex; padding: 10px; background: #1e293b; border-top: 1px solid #334155; gap: 8px; }
        input { flex: 1; background: #0f172a; border: 1px solid #475569; color: white; padding: 12px; border-radius: 8px; outline: none; font-size: 15px; }
        button { background: #2563eb; color: white; border: none; padding: 0 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <header>💬 Мой Мессенджер</header>
    <div id="chat"></div>

    <div class="input-box">
        <input type="text" id="messageInput" placeholder="Введите сообщение..." autofocus>
        <button onclick="sendMessage()">Отправить</button>
    </div>

<script>
    const username = prompt("Введите ваше имя:") || "Гость";
    // Замени IP/домен на свой актуальный адрес сервера и порт 9000 (или через Nginx с SSL)
    const ws = new WebSocket('wss://194-76-138-9.sslip.io:9000/ws');
    const chat = document.getElementById('chat');
    const input = document.getElementById('messageInput');

    ws.onmessage = function(event) {
        const response = JSON.parse(event.data);
        if (response.type === 'history') {
            response.data.forEach(m => appendMessage(m.username, m.text));
        } else if (response.type === 'message') {
            appendMessage(response.username, response.text);
        }
    };

    function appendMessage(author, text) {
        const div = document.createElement('div');
        div.className = 'msg' + (author === username ? ' me' : '');
        div.innerHTML = `<div class="author">${author}</div><div>${text}</div>`;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    function sendMessage() {
        const text = input.value.trim();
        if (text) {
            ws.send(JSON.stringify({ username: username, text: text }));
            input.value = '';
        }
    }

    input.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') sendMessage();
    });
</script>
</body>
</html>
